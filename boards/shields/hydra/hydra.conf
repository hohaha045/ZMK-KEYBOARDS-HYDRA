# Pointing (common)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y
# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# Prolong battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
# Bluetooth stability
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
# Prevent BT_SMP_ALLOW_UNAUTH_OVERWRITE from implying passkey entry
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
