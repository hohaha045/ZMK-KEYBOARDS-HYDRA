# -------------------------------------------------------------------------
# CURRENT: standalone (inline PMW3610 driver, no external dependencies)
# cmake/kconfig/dts_root expose the inline driver to the ZMK build system.
# -------------------------------------------------------------------------
name: zmk-keyboards-hydra
build:
  cmake: .
  kconfig: Kconfig
  settings:
    board_root: .
    dts_root: .

